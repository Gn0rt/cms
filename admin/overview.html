<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css"
      rel="stylesheet"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/about.css" />
    <link rel="stylesheet" href="./css/overview.css" />

    <title>Admin</title>
    <style></style>
  </head>
  <body>
    <header id="header">
      <div class="logo">
        <img src="../assets/img/logo1.png" alt="" />
      </div>
      <nav class="navbar">
        <ul class="nav-menu">
          <li class="item active">
            <a href="./overview.html"
              ><i class="fa-solid fa-cube"></i>Tổng quan</a
            >
          </li>
          <li class="item">
            <a href="./admin.html"
              ><i class="fa-solid fa-house"></i>Trang chủ</a
            >
          </li>
          <li class="item">
            <a href=""><i class="fa-solid fa-computer"></i>Sản phẩm</a>
          </li>
          <li class="item">
            <a href="./about.html"
              ><i class="fa-solid fa-users-rectangle"></i>Về chúng tôi</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <section id="content">
      <h2 class="title"><i class="fa-solid fa-cube"></i>Quản lý footer</h2>
      <div class="container-fluid p-3">
        <div class="card">
          <div class="card-header">
            <i class="fa-solid fa-image"></i> Logo công ty
          </div>
          <div class="card-body">
            <form id="">
              <div class="card-content">
                <div class="about-content">
                  <label class="">Logo</label>
                  <div class="banner-image">
                    <img
                      src="../assets/img/ban.png"
                      class="img-thumbnail"
                      style="height: 150px; width: 100%; object-fit: cover"
                    />
                  </div>
                  <input type="file" class="choose-inmage" />
                </div>
              </div>
              <button type="button" class="save-btn">Lưu hình ảnh</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <i class="fa-solid fa-info-circle"></i> Nội dung
          </div>
          <div class="card-body">
            <div class="form-card">
              <label for="">Địa chỉ</label>
              <input type="text" />
            </div>
            <div class="form-card">
              <label for="">Số điện thoại</label>
              <input type="text" />
            </div>
            <div class="form-card">
              <label for="">Zalo</label>
              <input type="text" />
            </div>
            <div class="form-card">
              <label for="">Email</label>
              <input type="text" />
            </div>
            <div class="form-card">
              <label for="">Website</label>
              <input type="text" />
            </div>
            <button type="button" class="save-btn">Lưu Giới thiệu</button>
          </div>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script>
      $("#summernote-intro").summernote({
        placeholder: "Nhập nội dung bài viết...",
        tabsize: 2,
        height: 200, // Chiều cao khung soạn thảo
      });
    </script>
  </body>
</html>
